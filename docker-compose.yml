services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: separacion-cuentas-sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Ab123456_
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./ApiCQRS/DDLs:/docker-entrypoint-initdb.d
    restart: unless-stopped

volumes:
  sqlserver_data:
